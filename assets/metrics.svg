<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Production telemetry: 50+ microservices, 25 EKS clusters, 99.95% uptime, ~$50K per year saved. MTTR reduced 35%, cloud spend 20%, onboarding 97%, manual deploy effort 70%, primary DB load 40%.">
  <defs>
    <linearGradient id="mBar1" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="900" y2="0">
      <stop offset="0" stop-color="#EAFF7A"/><stop offset="1" stop-color="#7DF9A8"/>
    </linearGradient>
    <linearGradient id="mBar2" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="900" y2="0">
      <stop offset="0" stop-color="#7DF9A8"/><stop offset="1" stop-color="#4CD8F5"/>
    </linearGradient>
    <linearGradient id="mBar3" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="900" y2="0">
      <stop offset="0" stop-color="#4CD8F5"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="mBar4" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="900" y2="0">
      <stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="mBar5" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="900" y2="0">
      <stop offset="0" stop-color="#FB7185"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="mGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#232C38" stroke-width="1"/>
    </pattern>
    <clipPath id="mClip"><rect x="1" y="1" width="998" height="328" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#mClip)">
    <rect width="1000" height="330" fill="#0B0E13"/>
    <rect width="1000" height="330" fill="url(#mGrid)" opacity="0.8"/>
    <ellipse cx="820" cy="30" rx="300" ry="170" fill="url(#mGlow)"/>

    <text x="26" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="12.5" font-weight="700" letter-spacing="2.6" fill="#8B98A8">MEASURED PRODUCTION IMPACT</text>
    <text x="974" y="34" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="11" font-weight="700" letter-spacing="1.4" fill="#8B98A8">2021 - PRESENT</text>

    <!-- KPI tiles: solid accent bar + oversized figure, readable on any panel -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <g transform="translate(24 50)">
        <rect width="226" height="92" rx="10" fill="#111721" stroke="#2A3441" stroke-width="1.5"/>
        <rect x="0" y="0" width="6" height="92" rx="3" fill="#EAFF7A"/>
        <text x="22" y="46" font-size="34" font-weight="700" fill="#EAFF7A">50+</text>
        <text x="22" y="70" font-size="11.5" font-weight="700" letter-spacing="0.8" fill="#9BA7B4">MICROSERVICES</text>
        <text x="22" y="84" font-size="10.5" fill="#6C7887">on a self-run EKS platform</text>
      </g>
      <g transform="translate(266 50)">
        <rect width="226" height="92" rx="10" fill="#111721" stroke="#2A3441" stroke-width="1.5"/>
        <rect x="0" y="0" width="6" height="92" rx="3" fill="#7DF9A8"/>
        <text x="22" y="46" font-size="34" font-weight="700" fill="#7DF9A8">25</text>
        <text x="22" y="70" font-size="11.5" font-weight="700" letter-spacing="0.8" fill="#9BA7B4">EKS CLUSTERS</text>
        <text x="22" y="84" font-size="10.5" fill="#6C7887">provisioned via Terraform</text>
      </g>
      <g transform="translate(508 50)">
        <rect width="226" height="92" rx="10" fill="#111721" stroke="#2A3441" stroke-width="1.5"/>
        <rect x="0" y="0" width="6" height="92" rx="3" fill="#4CD8F5"/>
        <text x="22" y="46" font-size="34" font-weight="700" fill="#4CD8F5">99.95%</text>
        <text x="22" y="70" font-size="11.5" font-weight="700" letter-spacing="0.8" fill="#9BA7B4">UPTIME SLA</text>
        <text x="22" y="84" font-size="10.5" fill="#6C7887">held on multi-AZ node groups</text>
      </g>
      <g transform="translate(750 50)">
        <rect width="226" height="92" rx="10" fill="#111721" stroke="#2A3441" stroke-width="1.5"/>
        <rect x="0" y="0" width="6" height="92" rx="3" fill="#FBBF24"/>
        <text x="22" y="46" font-size="34" font-weight="700" fill="#FBBF24">~$50K</text>
        <text x="22" y="70" font-size="11.5" font-weight="700" letter-spacing="0.8" fill="#9BA7B4">SAVED PER YEAR</text>
        <text x="22" y="84" font-size="10.5" fill="#6C7887">Savings Plans + autoscaling</text>
      </g>
    </g>

    <!-- Animated impact bars: each fill grows from zero on load -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">
      <g transform="translate(24 166)">
        <text x="0" y="12" fill="#C3CDD9">MTTR reduced</text>
        <rect x="240" y="2" width="640" height="13" rx="6.5" fill="#1A222E"/>
        <rect x="240" y="2" width="0" height="13" rx="6.5" fill="url(#mBar1)">
          <animate attributeName="width" from="0" to="224" dur="1.4s" begin="0.1s" fill="freeze"/>
        </rect>
        <text x="896" y="12" fill="#EAFF7A">−35%</text>
      </g>
      <g transform="translate(24 196)">
        <text x="0" y="12" fill="#C3CDD9">Cloud spend cut</text>
        <rect x="240" y="2" width="640" height="13" rx="6.5" fill="#1A222E"/>
        <rect x="240" y="2" width="0" height="13" rx="6.5" fill="url(#mBar2)">
          <animate attributeName="width" from="0" to="128" dur="1.4s" begin="0.25s" fill="freeze"/>
        </rect>
        <text x="896" y="12" fill="#7DF9A8">−20%</text>
      </g>
      <g transform="translate(24 226)">
        <text x="0" y="12" fill="#C3CDD9">Onboarding time cut</text>
        <rect x="240" y="2" width="640" height="13" rx="6.5" fill="#1A222E"/>
        <rect x="240" y="2" width="0" height="13" rx="6.5" fill="url(#mBar3)">
          <animate attributeName="width" from="0" to="621" dur="1.4s" begin="0.4s" fill="freeze"/>
        </rect>
        <text x="896" y="12" fill="#4CD8F5">−97%</text>
      </g>
      <g transform="translate(24 256)">
        <text x="0" y="12" fill="#C3CDD9">Manual deploy effort cut</text>
        <rect x="240" y="2" width="640" height="13" rx="6.5" fill="#1A222E"/>
        <rect x="240" y="2" width="0" height="13" rx="6.5" fill="url(#mBar4)">
          <animate attributeName="width" from="0" to="448" dur="1.4s" begin="0.55s" fill="freeze"/>
        </rect>
        <text x="896" y="12" fill="#FBBF24">−70%</text>
      </g>
      <g transform="translate(24 286)">
        <text x="0" y="12" fill="#C3CDD9">Primary DB load cut</text>
        <rect x="240" y="2" width="640" height="13" rx="6.5" fill="#1A222E"/>
        <rect x="240" y="2" width="0" height="13" rx="6.5" fill="url(#mBar5)">
          <animate attributeName="width" from="0" to="256" dur="1.4s" begin="0.7s" fill="freeze"/>
        </rect>
        <text x="896" y="12" fill="#FB7185">−40%</text>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="998" height="328" rx="16" fill="none" stroke="#2A3441" stroke-width="2"/>
</svg>
