<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 196" width="1000" height="196" role="img" aria-label="Shubh Malhotra — DevOps, SRE, Cloud Infrastructure">
  <!-- Flat by design: same visual language as the shields badges below (solid fills, no
       gradients, no glow), so the header reads as part of the README, not a separate hero. -->
  <rect width="1000" height="196" fill="#0D1117"/>

  <text x="24" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="13" font-weight="700" letter-spacing="3.2" fill="#8B949E">DEVOPS · SRE · CLOUD INFRASTRUCTURE</text>

  <g>
    <text x="22" y="102" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif"
          font-size="54" font-weight="700" letter-spacing="-1" fill="#F0F6FC">Shubh Malhotra</text>
    <rect x="446" y="80" width="16" height="28" fill="#EAFF7A">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="24" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14.5" fill="#C9D1D9">Kubernetes platforms · Terraform IaC · GitOps · Observability</text>

  <!-- Chips mirror shields' for-the-badge geometry: square corners, uppercase, bold mono -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">
    <g transform="translate(24 150)"><rect width="152" height="28" fill="#EAFF7A"/><text x="14" y="18.5" fill="#0D1117">50+ MICROSERVICES</text></g>
    <g transform="translate(184 150)"><rect width="126" height="28" fill="#7DF9A8"/><text x="14" y="18.5" fill="#0D1117">99.95% UPTIME</text></g>
    <g transform="translate(318 150)"><rect width="100" height="28" fill="#4CD8F5"/><text x="14" y="18.5" fill="#0D1117">−35% MTTR</text></g>
    <g transform="translate(426 150)"><rect width="96" height="28" fill="#FBBF24"/><text x="14" y="18.5" fill="#0D1117">−$50K/YR</text></g>
    <g transform="translate(530 150)"><rect width="132" height="28" fill="#A78BFA"/><text x="14" y="18.5" fill="#0D1117">25 EKS CLUSTERS</text></g>
  </g>

  <!-- Hue rail: the exact badge palette used throughout the page -->
  <g>
    <rect x="0"   y="190" width="200" height="6" fill="#EAFF7A"/>
    <rect x="200" y="190" width="200" height="6" fill="#7DF9A8"/>
    <rect x="400" y="190" width="200" height="6" fill="#4CD8F5"/>
    <rect x="600" y="190" width="200" height="6" fill="#A78BFA"/>
    <rect x="800" y="190" width="200" height="6" fill="#FBBF24"/>
  </g>
</svg>
