<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 196" width="1000" height="196" role="img" aria-label="Shubh Malhotra — DevOps, SRE, Cloud Infrastructure">
  <!-- Light-theme twin of banner-dark.svg: identical geometry, GitHub light canvas,
       chip fills gain a hairline so bright colours still separate from white. -->
  <rect width="1000" height="196" fill="#FFFFFF"/>

  <text x="24" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="13" font-weight="700" letter-spacing="3.2" fill="#59636E">DEVOPS · SRE · CLOUD INFRASTRUCTURE</text>

  <g>
    <text x="22" y="102" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif"
          font-size="54" font-weight="700" letter-spacing="-1" fill="#1F2328">Shubh Malhotra</text>
    <rect x="446" y="80" width="16" height="28" fill="#65A30D">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="24" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14.5" fill="#32383F">Kubernetes platforms · Terraform IaC · GitOps · Observability</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">
    <g transform="translate(24 150)"><rect width="152" height="28" fill="#EAFF7A" stroke="#65A30D" stroke-width="1.2"/><text x="14" y="18.5" fill="#1A2E05">50+ MICROSERVICES</text></g>
    <g transform="translate(184 150)"><rect width="126" height="28" fill="#7DF9A8" stroke="#059669" stroke-width="1.2"/><text x="14" y="18.5" fill="#022C22">99.95% UPTIME</text></g>
    <g transform="translate(318 150)"><rect width="100" height="28" fill="#4CD8F5" stroke="#0891B2" stroke-width="1.2"/><text x="14" y="18.5" fill="#083344">−35% MTTR</text></g>
    <g transform="translate(426 150)"><rect width="96" height="28" fill="#FBBF24" stroke="#D97706" stroke-width="1.2"/><text x="14" y="18.5" fill="#451A03">−$50K/YR</text></g>
    <g transform="translate(530 150)"><rect width="132" height="28" fill="#A78BFA" stroke="#7C3AED" stroke-width="1.2"/><text x="14" y="18.5" fill="#1E1B4B">25 EKS CLUSTERS</text></g>
  </g>

  <g>
    <rect x="0"   y="190" width="200" height="6" fill="#65A30D"/>
    <rect x="200" y="190" width="200" height="6" fill="#059669"/>
    <rect x="400" y="190" width="200" height="6" fill="#0891B2"/>
    <rect x="600" y="190" width="200" height="6" fill="#7C3AED"/>
    <rect x="800" y="190" width="200" height="6" fill="#D97706"/>
  </g>
</svg>
