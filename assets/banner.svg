<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Shubh Malhotra — DevOps, SRE, Cloud Infrastructure">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C6F24E"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C6F24E" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C6F24E" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blobA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C6F24E" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#C6F24E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1F2428" stroke-width="1"/>
    </pattern>
    <clipPath id="card">
      <rect x="1" y="1" width="998" height="258" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="260" fill="#0A0B0D"/>
    <rect width="1000" height="260" fill="url(#grid)" opacity="0.55"/>

    <!-- drifting aurora -->
    <ellipse cx="180" cy="60" rx="300" ry="180" fill="url(#blobA)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 70 30; -30 20; 0 0" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="860" cy="210" rx="320" ry="190" fill="url(#blobB)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -60 -30; 40 -15; 0 0" dur="20s" repeatCount="indefinite"/>
    </ellipse>

    <!-- logo mark: terminal prompt, echoing the portfolio favicon -->
    <g transform="translate(60 54)">
      <rect x="0" y="0" width="42" height="36" rx="10" fill="none" stroke="url(#brand)" stroke-width="2.4"/>
      <path d="M11 13 L17.5 18 L11 23" fill="none" stroke="url(#brand)" stroke-width="2.8"
            stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="22" y1="22.8" x2="32" y2="22.8" stroke="url(#brand)" stroke-width="2.8" stroke-linecap="round">
        <animate attributeName="opacity" values="1;1;0;0;1" dur="1.5s" repeatCount="indefinite"/>
      </line>
    </g>

    <text x="118" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="14" letter-spacing="3.4" fill="#8B949E">DEVOPS · SRE · CLOUD INFRASTRUCTURE</text>

    <text x="58" y="146" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
          font-size="58" font-weight="700" letter-spacing="-1" fill="url(#brand)">Shubh Malhotra</text>

    <text x="60" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="15.5" fill="#E8EAED">Kubernetes platforms · Terraform IaC · GitOps · Observability</text>

    <!-- stat chips -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
      <g transform="translate(60 206)">
        <rect width="150" height="30" rx="15" fill="#11140F" stroke="#2A331A"/>
        <circle cx="17" cy="15" r="3.6" fill="#C6F24E">
          <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <text x="30" y="19.5" fill="#C6F24E">50+ microservices</text>
      </g>
      <g transform="translate(222 206)">
        <rect width="132" height="30" rx="15" fill="#0E1512" stroke="#1C3A2E"/>
        <circle cx="17" cy="15" r="3.6" fill="#34D399">
          <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
        </circle>
        <text x="30" y="19.5" fill="#34D399">99.95% uptime</text>
      </g>
      <g transform="translate(366 206)">
        <rect width="118" height="30" rx="15" fill="#0E1512" stroke="#1C3A2E"/>
        <circle cx="17" cy="15" r="3.6" fill="#34D399">
          <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
        </circle>
        <text x="30" y="19.5" fill="#34D399">−35% MTTR</text>
      </g>
    </g>

    <!-- live latency trace -->
    <g transform="translate(560 96)">
      <path d="M0 60 H400" stroke="#1F2428" stroke-width="1"/>
      <path id="trace"
            d="M0 62 L26 54 L52 66 L78 42 L104 58 L130 30 L156 50 L182 22 L208 46 L234 16 L260 40 L286 26 L312 52 L338 34 L364 58 L390 44"
            fill="none" stroke="url(#fade)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"
            stroke-dasharray="620" stroke-dashoffset="620">
        <animate attributeName="stroke-dashoffset" from="620" to="0" dur="4.5s" repeatCount="indefinite"/>
      </path>
      <circle r="4" fill="#C6F24E">
        <animateMotion dur="4.5s" repeatCount="indefinite"
          path="M0 62 L26 54 L52 66 L78 42 L104 58 L130 30 L156 50 L182 22 L208 46 L234 16 L260 40 L286 26 L312 52 L338 34 L364 58 L390 44"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="-8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="11.5" letter-spacing="1.6" fill="#5C6470">P99 LATENCY · PROD</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="999" height="259" rx="18" fill="none" stroke="#1F2428"/>
</svg>
