<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Shubh Malhotra — DevOps, SRE, Cloud Infrastructure">
  <defs>
    <!-- High-luminance-travel gradient: reads as a gradient even when desaturated -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#EAFF7A"/>
      <stop offset="0.4" stop-color="#7DF9A8"/>
      <stop offset="0.75" stop-color="#4CD8F5"/>
      <stop offset="1"   stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EAFF7A"/>
      <stop offset="1" stop-color="#4CD8F5"/>
    </linearGradient>
    <radialGradient id="blobA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C6F24E" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#C6F24E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#39424F" stroke-width="1"/>
    </pattern>
    <clipPath id="card">
      <rect x="1" y="1" width="998" height="278" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- Lifted base: #14181F instead of near-black, so the grid and borders survive on weak panels -->
    <rect width="1000" height="280" fill="#14181F"/>
    <rect width="1000" height="280" fill="url(#grid)" opacity="0.9"/>

    <!-- Aurora at 3x the previous opacity, three distinct hues -->
    <ellipse cx="170" cy="50" rx="300" ry="180" fill="url(#blobA)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 70 30; -30 20; 0 0" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="700" cy="240" rx="320" ry="190" fill="url(#blobB)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -60 -30; 40 -15; 0 0" dur="20s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="960" cy="40" rx="240" ry="160" fill="url(#blobC)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -40 40; 20 10; 0 0" dur="24s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Saturated hue rail: pure luminance+hue blocks, legible on any display -->
    <g>
      <rect x="0" y="0" width="1000" height="5" fill="#14181F"/>
      <rect x="0"   y="0" width="200" height="5" fill="#EAFF7A"/>
      <rect x="200" y="0" width="200" height="5" fill="#7DF9A8"/>
      <rect x="400" y="0" width="200" height="5" fill="#4CD8F5"/>
      <rect x="600" y="0" width="200" height="5" fill="#A78BFA"/>
      <rect x="800" y="0" width="200" height="5" fill="#FBBF24"/>
    </g>

    <!-- logo mark -->
    <g transform="translate(60 62)">
      <rect x="0" y="0" width="44" height="38" rx="10" fill="none" stroke="#EAFF7A" stroke-width="3"/>
      <path d="M11.5 14 L18.5 19 L11.5 24" fill="none" stroke="#EAFF7A" stroke-width="3.2"
            stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="23" y1="23.6" x2="33" y2="23.6" stroke="#4CD8F5" stroke-width="3.2" stroke-linecap="round">
        <animate attributeName="opacity" values="1;1;0;0;1" dur="1.5s" repeatCount="indefinite"/>
      </line>
    </g>

    <text x="120" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="14.5" font-weight="700" letter-spacing="3.4" fill="#BFC9D6">DEVOPS · SRE · CLOUD INFRASTRUCTURE</text>

    <text x="58" y="156" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
          font-size="60" font-weight="700" letter-spacing="-1" fill="url(#brand)">Shubh Malhotra</text>

    <text x="60" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="16" fill="#FFFFFF">Kubernetes platforms · Terraform IaC · GitOps · Observability</text>

    <!-- Solid bright chips with dark text: maximum contrast regardless of gamut -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">
      <g transform="translate(60 216)">
        <rect width="164" height="32" rx="16" fill="#EAFF7A"/>
        <text x="16" y="21" fill="#14181F">50+ microservices</text>
      </g>
      <g transform="translate(236 216)">
        <rect width="146" height="32" rx="16" fill="#7DF9A8"/>
        <text x="16" y="21" fill="#14181F">99.95% uptime</text>
      </g>
      <g transform="translate(394 216)">
        <rect width="130" height="32" rx="16" fill="#4CD8F5"/>
        <text x="16" y="21" fill="#14181F">−35% MTTR</text>
      </g>
      <g transform="translate(536 216)">
        <rect width="132" height="32" rx="16" fill="#FBBF24"/>
        <text x="16" y="21" fill="#14181F">−$50K/yr</text>
      </g>
    </g>

    <!-- live latency trace: thicker strokes, bright baseline -->
    <g transform="translate(690 92)">
      <path d="M0 66 H260" stroke="#4A5563" stroke-width="1.5"/>
      <path d="M0 66 L17 58 L34 70 L51 46 L68 62 L85 34 L102 54 L119 26 L136 50 L153 20 L170 44 L187 30 L204 56 L221 38 L238 62 L255 48"
            fill="none" stroke="url(#trace)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"
            stroke-dasharray="460" stroke-dashoffset="460">
        <animate attributeName="stroke-dashoffset" from="460" to="0" dur="4.5s" repeatCount="indefinite"/>
      </path>
      <circle r="5" fill="#FFFFFF" stroke="#EAFF7A" stroke-width="2">
        <animateMotion dur="4.5s" repeatCount="indefinite"
          path="M0 66 L17 58 L34 70 L51 46 L68 62 L85 34 L102 54 L119 26 L136 50 L153 20 L170 44 L187 30 L204 56 L221 38 L238 62 L255 48"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="-8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="12" font-weight="700" letter-spacing="1.6" fill="#8F9BAB">P99 LATENCY · PROD</text>
    </g>
  </g>

  <rect x="1" y="1" width="998" height="278" rx="18" fill="none" stroke="#4A5563" stroke-width="2"/>
</svg>
