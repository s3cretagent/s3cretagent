<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 58" width="1000" height="58" role="img" aria-label="Section: Live project dashboards">
  <defs>
    <linearGradient id="spWash" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="700" y2="0">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.24"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="spClip"><rect x="1" y="1" width="998" height="56" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#spClip)">
    <rect width="1000" height="58" fill="#0B0E13"/>
    <rect width="1000" height="58" fill="url(#spWash)"/>
    <rect width="7" height="58" fill="#A78BFA"/>
    <text x="28" y="36" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif"
          font-size="19" font-weight="700" letter-spacing="0.4" fill="#F0F6FC">Selected projects</text>
    <text x="880" y="34" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="11" font-weight="700" letter-spacing="1.2" fill="#B9A6FF">INTERACTIVE DASHBOARDS</text>
    <g transform="translate(966 29)">
      <circle r="5" fill="#A78BFA"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
    </g>
    <line x1="900" y1="29" x2="946" y2="29" stroke="#A78BFA" stroke-width="2" stroke-dasharray="6 5" opacity="0.7">
      <animate attributeName="stroke-dashoffset" from="22" to="0" dur="1.2s" repeatCount="indefinite"/>
    </line>
  </g>
  <rect x="1" y="1" width="998" height="56" rx="12" fill="none" stroke="#2A3441" stroke-width="1.6"/>
</svg>
