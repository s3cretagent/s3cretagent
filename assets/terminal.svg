<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 262" width="1000" height="262" role="img" aria-label="whoami: Software Engineer, DevOps and SRE. Kubernetes EKS platform, 50+ microservices, 99.95% uptime. Terraform IaC to ArgoCD GitOps to zero-downtime releases. Prometheus, Grafana, Loki, PagerDuty, SLOs and error budgets. Currently at Superhero Tech.">
  <defs>
    <radialGradient id="tGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C6F24E" stop-opacity="0.16"/><stop offset="1" stop-color="#C6F24E" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tClip"><rect x="1" y="1" width="998" height="260" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#tClip)">
    <rect width="1000" height="262" fill="#0B0E13"/>
    <ellipse cx="120" cy="250" rx="320" ry="150" fill="url(#tGlow)"/>

    <!-- window chrome -->
    <rect width="1000" height="40" fill="#151B24"/>
    <circle cx="26" cy="20" r="6" fill="#FB7185"/>
    <circle cx="48" cy="20" r="6" fill="#FBBF24"/>
    <circle cx="70" cy="20" r="6" fill="#7DF9A8"/>
    <text x="94" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="12.5" font-weight="700" fill="#8B98A8">shubh@prod:~$ whoami --verbose</text>
    <text x="976" y="25" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="11" font-weight="700" fill="#5C6875">zsh</text>
    <line x1="0" y1="40" x2="1000" y2="40" stroke="#2A3441" stroke-width="1.5"/>

    <!-- syntax-coloured yaml -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">
      <text x="26" y="72"><tspan fill="#4CD8F5">role:      </tspan><tspan fill="#F0F6FC">Software Engineer, DevOps / SRE</tspan></text>
      <text x="26" y="98"><tspan fill="#4CD8F5">platform:  </tspan><tspan fill="#EAFF7A">Kubernetes (EKS)</tspan><tspan fill="#6C7887"> · </tspan><tspan fill="#F0F6FC">50+ microservices</tspan><tspan fill="#6C7887"> · </tspan><tspan fill="#7DF9A8">99.95%+ uptime SLA</tspan></text>
      <text x="26" y="124"><tspan fill="#4CD8F5">delivery:  </tspan><tspan fill="#F0F6FC">Terraform IaC </tspan><tspan fill="#A78BFA">→</tspan><tspan fill="#F0F6FC"> ArgoCD GitOps </tspan><tspan fill="#A78BFA">→</tspan><tspan fill="#F0F6FC"> zero-downtime releases</tspan></text>
      <text x="26" y="150"><tspan fill="#4CD8F5">signal:    </tspan><tspan fill="#F0F6FC">Prometheus · Grafana · Loki · PagerDuty · SLOs &amp; error budgets</tspan></text>
      <text x="26" y="176"><tspan fill="#4CD8F5">focus:     </tspan><tspan fill="#F0F6FC">reliability without runaway cloud cost, </tspan><tspan fill="#FB7185">−35% MTTR</tspan><tspan fill="#F0F6FC">, </tspan><tspan fill="#FBBF24">−20% spend</tspan></text>
      <text x="26" y="202"><tspan fill="#4CD8F5">scale:     </tspan><tspan fill="#F0F6FC">1M+ monthly users · 200+ Prometheus targets · 30+ repos</tspan></text>
      <text x="26" y="228"><tspan fill="#4CD8F5">currently: </tspan><tspan fill="#F0F6FC">Superhero Tech Pvt. Ltd. · Bengaluru</tspan></text>
    </g>

    <g>
      <text x="26" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="14.5" fill="#7DF9A8">shubh@prod:~$</text>
      <rect x="140" y="240" width="9" height="16" fill="#EAFF7A">
        <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <rect x="1" y="1" width="998" height="260" rx="14" fill="none" stroke="#2A3441" stroke-width="2"/>
</svg>
