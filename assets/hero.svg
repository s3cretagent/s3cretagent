<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 226" width="1000" height="226" role="img" aria-label="Shubh Malhotra — DevOps, SRE, Cloud Infrastructure. Available for new opportunities. Kubernetes platforms, Terraform IaC, GitOps, Observability. 50+ microservices, 99.95% uptime, −35% MTTR, −$50K per year.">
  <defs>
    <linearGradient id="hName" gradientUnits="userSpaceOnUse" x1="290" y1="0" x2="710" y2="0">
      <stop offset="0"    stop-color="#EAFF7A"/>
      <stop offset="0.38" stop-color="#7DF9A8"/>
      <stop offset="0.72" stop-color="#4CD8F5"/>
      <stop offset="1"    stop-color="#C4B5FD"/>
    </linearGradient>
    <radialGradient id="hA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C6F24E" stop-opacity="0.30"/><stop offset="1" stop-color="#C6F24E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.28"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#232C38" stroke-width="1"/>
    </pattern>
    <clipPath id="hClip"><rect x="1" y="1" width="998" height="224" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#hClip)">
    <rect width="1000" height="226" fill="#0B0E13"/>
    <rect width="1000" height="226" fill="url(#hGrid)" opacity="0.75"/>

    <!-- Two slow blobs are the only ambient motion; nothing here pretends to be a live chart. -->
    <ellipse cx="200" cy="20" rx="300" ry="150" fill="url(#hA)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 60 24; -26 14; 0 0" dur="19s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="800" cy="215" rx="300" ry="150" fill="url(#hB)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -54 -22; 30 -10; 0 0" dur="23s" repeatCount="indefinite"/>
    </ellipse>

    <!-- status pill, centred -->
    <g transform="translate(364 20)">
      <rect width="272" height="30" rx="15" fill="#12200F" stroke="#5C8B1E" stroke-width="1.4"/>
      <circle cx="18" cy="15" r="4.5" fill="#C6F24E">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="12.5" font-weight="700" fill="#DCFF8C">AVAILABLE FOR NEW OPPORTUNITIES</text>
    </g>

    <text x="500" y="74" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13" font-weight="700" letter-spacing="3.2" fill="#9BA7B4">DEVOPS · SRE · CLOUD INFRASTRUCTURE</text>

    <!-- textLength pins the width, so the caret always sits just after the final letter -->
    <text x="290" y="130" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif"
          font-size="54" font-weight="700" textLength="420" lengthAdjust="spacing" fill="url(#hName)">Shubh Malhotra</text>
    <rect x="718" y="96" width="12" height="35" fill="#FFFFFF">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <text x="500" y="161" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="14.5" fill="#E8EDF3">Kubernetes platforms · Terraform IaC · GitOps · Observability</text>

    <!-- four solid chips, centred as one row -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">
      <g transform="translate(216 178)"><rect width="158" height="30" rx="15" fill="#EAFF7A"/><text x="16" y="20" fill="#0B0E13">50+ microservices</text></g>
      <g transform="translate(382 178)"><rect width="141" height="30" rx="15" fill="#7DF9A8"/><text x="16" y="20" fill="#0B0E13">99.95% uptime</text></g>
      <g transform="translate(531 178)"><rect width="125" height="30" rx="15" fill="#4CD8F5"/><text x="16" y="20" fill="#0B0E13">−35% MTTR</text></g>
      <g transform="translate(664 178)"><rect width="120" height="30" rx="15" fill="#FBBF24"/><text x="16" y="20" fill="#0B0E13">−$50K/yr</text></g>
    </g>

    <!-- hue rail ties the header to the badge palette used down the page -->
    <rect x="0"   y="220" width="200" height="6" fill="#EAFF7A"/>
    <rect x="200" y="220" width="200" height="6" fill="#7DF9A8"/>
    <rect x="400" y="220" width="200" height="6" fill="#4CD8F5"/>
    <rect x="600" y="220" width="200" height="6" fill="#A78BFA"/>
    <rect x="800" y="220" width="200" height="6" fill="#FBBF24"/>
  </g>

  <rect x="1" y="1" width="998" height="224" rx="16" fill="none" stroke="#2A3441" stroke-width="2"/>
</svg>
