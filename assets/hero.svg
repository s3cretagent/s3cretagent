<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Shubh Malhotra — Site Reliability and DevOps Engineer. 50+ microservices on EKS, 99.95% uptime, 25 Terraform-provisioned clusters.">
  <defs>
    <linearGradient id="hName" gradientUnits="userSpaceOnUse" x1="34" y1="0" x2="620" y2="0">
      <stop offset="0"    stop-color="#EAFF7A"/>
      <stop offset="0.35" stop-color="#7DF9A8"/>
      <stop offset="0.7"  stop-color="#4CD8F5"/>
      <stop offset="1"    stop-color="#C4B5FD"/>
    </linearGradient>
    <radialGradient id="hA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C6F24E" stop-opacity="0.40"/><stop offset="1" stop-color="#C6F24E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.38"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.34"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#2A3441" stroke-width="1"/>
    </pattern>
    <clipPath id="hClip"><rect x="1" y="1" width="998" height="298" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#hClip)">
    <rect width="1000" height="300" fill="#0B0E13"/>

    <!-- drifting grid: gives the surface depth like the portfolio's wave mesh -->
    <g>
      <rect x="-40" y="-40" width="1080" height="380" fill="url(#hGrid)" opacity="0.85"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 36 18; 0 36; -36 18; 0 0" dur="28s" repeatCount="indefinite"/>
    </g>

    <ellipse cx="140" cy="40" rx="300" ry="170" fill="url(#hA)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 70 34; -30 20; 0 0" dur="17s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="620" cy="290" rx="330" ry="185" fill="url(#hB)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -60 -30; 40 -14; 0 0" dur="21s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="960" cy="60" rx="260" ry="170" fill="url(#hC)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -44 44; 20 12; 0 0" dur="25s" repeatCount="indefinite"/>
    </ellipse>

    <!-- status pill -->
    <g transform="translate(34 30)">
      <rect width="272" height="30" rx="15" fill="#12200F" stroke="#5C8B1E" stroke-width="1.4"/>
      <circle cx="18" cy="15" r="4.5" fill="#C6F24E">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="r" values="4.5;6;4.5" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="12.5" font-weight="700" fill="#DCFF8C">AVAILABLE FOR NEW OPPORTUNITIES</text>
    </g>

    <text x="34" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13" font-weight="700" letter-spacing="3.4" fill="#9BA7B4">DEVOPS · SRE · CLOUD INFRASTRUCTURE</text>

    <!-- textLength pins the rendered width regardless of which font resolves, so the
         caret below always lands immediately after the final letter. -->
    <text x="32" y="152" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif"
          font-size="58" font-weight="700" textLength="446" lengthAdjust="spacing" fill="url(#hName)">Shubh Malhotra</text>
    <rect x="490" y="114" width="13" height="38" fill="#FFFFFF">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- rotating tagline: three phrases cross-fading, like the portfolio's typewriter -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600">
      <text x="34" y="190" fill="#EAFF7A" opacity="0">I engineer Kubernetes platforms that hold 99.95% uptime.
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.29;0.33" dur="12s" begin="0s" repeatCount="indefinite"/>
      </text>
      <text x="34" y="190" fill="#7DF9A8" opacity="0">I provision 25 EKS clusters entirely as Terraform code.
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.29;0.33" dur="12s" begin="4s" repeatCount="indefinite"/>
      </text>
      <text x="34" y="190" fill="#4CD8F5" opacity="0">I get paid to make production boring.
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.29;0.33" dur="12s" begin="8s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- floating KPI chips -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700">
      <g transform="translate(34 220)">
        <rect width="168" height="32" rx="16" fill="#EAFF7A"/>
        <text x="16" y="21" fill="#0B0E13">☸ 50+ MICROSERVICES</text>
        <animateTransform attributeName="transform" type="translate" values="34 220; 34 214; 34 220" dur="5s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(214 220)">
        <rect width="150" height="32" rx="16" fill="#7DF9A8"/>
        <text x="16" y="21" fill="#0B0E13">⚡ 99.95% UPTIME</text>
        <animateTransform attributeName="transform" type="translate" values="214 220; 214 213; 214 220" dur="5s" begin="0.8s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(376 220)">
        <rect width="132" height="32" rx="16" fill="#4CD8F5"/>
        <text x="16" y="21" fill="#0B0E13">📉 −35% MTTR</text>
        <animateTransform attributeName="transform" type="translate" values="376 220; 376 214; 376 220" dur="5s" begin="1.6s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(520 220)">
        <rect width="136" height="32" rx="16" fill="#FBBF24"/>
        <text x="16" y="21" fill="#0B0E13">💰 −$50K / YEAR</text>
        <animateTransform attributeName="transform" type="translate" values="520 220; 520 213; 520 220" dur="5s" begin="2.4s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- right: rotating cluster ring, echoing the portfolio's 3D avatar stage -->
    <g transform="translate(838 150)">
      <circle r="86" fill="none" stroke="#2A3441" stroke-width="1.5"/>
      <circle r="62" fill="none" stroke="#2A3441" stroke-width="1.5"/>
      <circle r="38" fill="none" stroke="#2A3441" stroke-width="1.5"/>
      <g>
        <circle cx="86" cy="0" r="6" fill="#EAFF7A"/>
        <circle cx="-86" cy="0" r="5" fill="#4CD8F5"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="0" cy="62" r="5" fill="#7DF9A8"/>
        <circle cx="0" cy="-62" r="5" fill="#A78BFA"/>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite"/>
      </g>
      <circle r="26" fill="#12161D" stroke="#3D4A5C" stroke-width="1.5"/>
      <text y="5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="18" font-weight="700" fill="#EAFF7A">☸</text>
      <text y="112" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="11" font-weight="700" letter-spacing="1.4" fill="#8B98A8">EKS · MULTI-AZ</text>
    </g>
  </g>

  <rect x="1" y="1" width="998" height="298" rx="16" fill="none" stroke="#2A3441" stroke-width="2"/>
</svg>
